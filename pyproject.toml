[project]
name = "nnunet-lite"
version = "0.1.0"
description = "Convert nnU-Net models to a standalone safetensors bundle and run nnU-Net-quality inference without nnU-Net"
readme = "README.md"
authors = [
    { name = "idinsmore1", email = "irdinsmore1@geisinger.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "connected-components-3d>=4.1.1",
    "nibabel>=5.4.2",
    "numpy>=2.4.6",
    "safetensors>=0.8.0",
    "scipy>=1.17.1",
    "torch>=2.9",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
target-version = "py311"
src = ["src"]
extend-exclude = ["packages"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = ["^packages/"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# nibabel's orientation and image-construction helpers are not annotated.
module = ["nnunet_lite.io"]
disallow_untyped_calls = false
